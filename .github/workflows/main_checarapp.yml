# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - checarApp

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '18.x'
  AZURE_WEBAPP_NAME: 'checarApp'
  AZURE_WEBAPP_SLOT: 'Production'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build main API
        run: npm run build --if-present

      - name: Install and build frontend-web
        run: |
          cd frontend-web
          npm ci --prefer-offline --no-audit
          npm run build

      - name: Run tests
        run: npm run test --if-present
        continue-on-error: true

      - name: Cleanup node_modules for deployment
        run: |
          rm -rf node_modules frontend-web/node_modules
          npm ci --prefer-offline --no-audit --production
          cd frontend-web
          npm ci --prefer-offline --no-audit --production
          cd ..

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            src/
            frontend-web/dist/
            frontend-web/public/
            package.json
            package-lock.json
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3CEA566512184E708A9DB2FD993E1E06 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D2F8A4F3315743409AC8FCD991F5428B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DD107EC6E9E54704BD06FE2000396578 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: ${{ env.AZURE_WEBAPP_SLOT }}
          package: .

      - name: Logout from Azure
        if: always()
        run: az logout
