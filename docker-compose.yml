version: '3.9'

services:
  # API Principal (monolito modular — continua em produção)
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/checar
      - REDIS_URL=redis://redis:6379
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Microserviço de Autenticação
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - AUTH_PORT=3001
      - MONGO_URI=mongodb://mongo:27017/checar
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # Microserviço de Veículos
  vehicle-service:
    build:
      context: .
      dockerfile: services/vehicle-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - VEHICLE_PORT=3002
      - MONGO_URI=mongodb://mongo:27017/checar
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # Microserviço de Checklists
  checklist-service:
    build:
      context: .
      dockerfile: services/checklist-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - CHECKLIST_PORT=3003
      - MONGO_URI=mongodb://mongo:27017/checar
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # Microserviço de Notificações
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "3004:3004"
    environment:
      - NOTIFICATION_PORT=3004
      - MONGO_URI=mongodb://mongo:27017/checar
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # Microserviço de Auditoria
  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    ports:
      - "3005:3005"
    environment:
      - AUDIT_PORT=3005
      - MONGO_URI=mongodb://mongo:27017/checar
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # Gateway NGINX
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - auth-service
      - vehicle-service
      - checklist-service
      - notification-service
      - audit-service
    restart: unless-stopped

  # Message Broker RabbitMQ
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MongoDB
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis (para BullMQ / cache)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
  rabbitmq_data:
