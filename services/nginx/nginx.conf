events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:3001;
    }
    upstream vehicle_service {
        server vehicle-service:3002;
    }
    upstream notification_service {
        server notification-service:3004;
    }
    upstream audit_service {
        server audit-service:3005;
    }
    upstream main_api {
        server api:3000;
    }

    server {
        listen 80;

        # ── Health check global ──────────────────────────────────
        location /health {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── Login → auth-service ─────────────────────────────────
        # Apenas autenticação. Registro e gestão de usuários ficam
        # na API principal que tem RBAC completo.
        location ~ ^/login {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Gestão de usuários + LGPD → main API ─────────────────
        # /usuarios         (POST registro público, GET/PUT/DELETE Gestor)
        # /aceitar-termos   (LGPD Art. 7° — consentimento)
        # /meus-dados       (LGPD Art. 18 — direito de acesso)
        location ~ ^/(usuarios|aceitar-termos|meus-dados) {
            proxy_pass http://main_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # /me (DELETE — LGPD Art. 18 — direito ao esquecimento)
        # exact match para evitar colisão com paths como /menu
        location = /me {
            proxy_pass http://main_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── Veículos → vehicle-service ───────────────────────────
        location /vehicles {
            proxy_pass http://vehicle_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Checklists, itens e modelos → main API ────────────────
        # checklist-service implementa apenas GET /modelochecklists.
        # A API principal tem a implementação completa com auth,
        # compliance service e RBAC. Roteamento consolidado aqui
        # até que o checklist-service seja expandido.
        location ~ ^/(modelochecklists|checklists|itemchecklists) {
            proxy_pass http://main_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Notificações → notification-service ──────────────────
        location /notificacoes {
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── FCM tokens → main API ─────────────────────────────────
        location /fcm-tokens {
            proxy_pass http://main_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Auditoria → audit-service ─────────────────────────────
        location /audit {
            proxy_pass http://audit_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ── Fallback: tudo mais → API principal ──────────────────
        # Inclui: /inspecao, /inspecoes, /relatorios, /exportacoes,
        # /api-docs, /uploads, /health (rota do app)
        location / {
            proxy_pass http://main_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }
    }
}
