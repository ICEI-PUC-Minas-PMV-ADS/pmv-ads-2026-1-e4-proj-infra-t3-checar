events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:3001;
    }
    upstream vehicle_service {
        server vehicle-service:3002;
    }
    upstream checklist_service {
        server checklist-service:3003;
    }
    upstream notification_service {
        server notification-service:3004;
    }
    upstream audit_service {
        server audit-service:3005;
    }
    upstream main_api {
        server api:3000;
    }

    server {
        listen 80;

        # Rota /health global
        location /health {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        # Auth e usuários
        location ~ ^/(login|usuarios|aceitar-termos|meus-dados|me) {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Veículos
        location /vehicles {
            proxy_pass http://vehicle_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Checklists e modelos
        location ~ ^/(modelochecklists|checklists|itemchecklists) {
            proxy_pass http://checklist_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Notificações
        location /notificacoes {
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Auditoria
        location /audit {
            proxy_pass http://audit_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Todo o resto vai para a API principal (monolito)
        location / {
            proxy_pass http://main_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }
    }
}
